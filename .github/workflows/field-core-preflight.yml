name: Field Core Preflight

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Fusion 2.0 preflight
        working-directory: Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1
        run: python tools/preflight.py
