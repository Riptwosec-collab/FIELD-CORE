name: FIELD CORE Advanced Phase 3 Apply

on:
  push:
    branches:
      - agent/field-core-full-upgrade
    paths:
      - tools/apply_field_core_advanced_phase3.py
      - .github/workflows/field-core-advanced-phase3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/field-core-full-upgrade
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply phase 3
        run: python tools/apply_field_core_advanced_phase3.py
      - name: Validate Fusion + Advanced
        run: |
          cd Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1
          python tools/preflight.py
      - name: Validate diff
        run: git diff --check
      - name: Commit phase 3 source
        run: |
          if git diff --quiet; then
            echo "Phase 3 already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/android-companion/app/src/main/AndroidManifest.xml
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/android-companion/app/src/main/java/com/riptwosec/fieldcore/FieldUpgradeManager.java
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/android-companion/app/src/main/java/com/riptwosec/fieldcore/WifiScoutManager.java
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/watch-lite/entry/src/main/js/MainAbility/pages/index/index.js
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/watch-lite/entry/src/main/js/MainAbility/pages/index/index.hml
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/watch-lite/entry/src/main/js/MainAbility/pages/index/index.css
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/tools/preflight.py
          git commit -m "Integrate FIELD CORE Advanced Pro phase 3 [advanced-applied]"
          git push origin HEAD:agent/field-core-full-upgrade
