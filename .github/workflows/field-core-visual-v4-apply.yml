name: FIELD CORE Visual V4 Apply

on:
  push:
    branches:
      - agent/field-core-full-upgrade
    paths:
      - tools/apply_field_core_visual_v4.py
      - .github/workflows/field-core-visual-v4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/field-core-full-upgrade
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply distinct Masterpiece all-page visuals
        run: python tools/apply_field_core_visual_v4.py
      - name: Validate FIELD CORE preflight
        run: |
          cd Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1
          python tools/preflight.py
      - name: Validate diff
        run: git diff --check
      - name: Commit visual source
        run: |
          if git diff --quiet; then
            echo "Visual V4 already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/watch-lite/entry/src/main/js/MainAbility/pages/index/index.hml
          git add Field_Core_FIT4PRO_V1/Field_Core_FIT4PRO_V1/watch-lite/entry/src/main/js/MainAbility/pages/index/index.css
          git commit -m "Apply distinct Masterpiece UI to every FIELD CORE page [visual-v4]"
          git push origin HEAD:agent/field-core-full-upgrade
