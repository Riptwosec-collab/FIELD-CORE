plugins { id 'com.android.application' }

android {
    namespace 'com.riptwosec.fieldcore'
    compileSdk 35
    defaultConfig {
        applicationId 'com.riptwosec.fieldcore'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-fieldcore-fusion'
        buildConfigField 'String', 'WATCH_PACKAGE', '"com.riptwosec.fieldcore.watch"'
        buildConfigField 'String', 'WATCH_FINGERPRINT', '"REPLACE_WITH_WATCH_SHA256_FINGERPRINT"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.huawei.hms:wearengine:5.0.2.306'
}
